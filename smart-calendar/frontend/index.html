App.saveManualTodo = async function() {
  const title = this.state.todoDraftTitle.trim();

App.saveEvent = async function() {

  if (!f.title.trim()) return;
  const endDate = f.endDate < f.startDate ? f.startDate : f.endDate;
  const payload = { title:f.title, startDate:f.startDate, endDate, start:f.start, end:f.end, alarm:f.alarm, notify:f.notify, priority:f.priority };
  try {
    if (this.state.modalMode === 'edit') {

    } else {
      await fetch(`${API_BASE}/schedule`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    }
    await this.reloadAll();
    this.setState({ modalOpen:false, selectedDate: f.startDate, tab:'calendar', calendarMode:'event' });
    if (this.state.modalMode !== 'edit') {
      this.showToast(`"${f.title}" 일정이 등록됐어요!`);
      this.scheduleTestAlarm({ title: f.title });

    alert('일정 저장 실패: ' + err.message);

};

App.addCat = function() {
  if (this.state.catDraft.length >= MAX_CATEGORIES) return;
  // 아직 아무도 안 쓰는 색을 골라준다
  const used = new Set(this.state.catDraft.map(c => c.hue));
  const hue = HUE_PALETTE.find(h => !used.has(h)) ?? HUE_PALETTE[0];
  // key는 만들 때 한 번만 정하고, 나중에 이름을 바꿔도 그대로 둔다
  // (이미 저장된 일정들이 이 key로 종류를 가리키고 있기 때문)
  let key = '종류' + (this.state.catDraft.length + 1);
  const keys = new Set(this.state.catDraft.map(c => c.key));
  let n = this.state.catDraft.length + 1;
  while (keys.has(key)) { n += 1; key = '종류' + n; }

  this.setState(s => ({
    catDraft: [...s.catDraft, { key, label:'', hue, leadDays:0, aiDecides:true, stepTemplate:'generic' }],
    catExpanded: s.catDraft.length,
  }));
};

  this.setState(s => ({ catDraft: s.catDraft.filter((_, j) => j !== i), catExpanded: null }));
};
App.saveCategoryDraft = function() {

  if (!draft.length) { alert('종류는 최소 1개 이상이어야 해요.'); return; }

  const labels = draft.map(c => c.label);
  if (new Set(labels).size !== labels.length) {
    alert('같은 이름을 가진 종류가 있어요. 이름을 서로 다르게 해주세요.');
    return;
  }

  this.saveCategories(draft);
  this.setState({ catEditorOpen:false, catDraft:[], catExpanded:null });
  this.showToast('일정 종류를 저장했어요!');
};

// ---------- 준비 단계 구성 편집 ----------
App.openStepEditor = function(eventId) {
  const ev = this.state.events.find(e => e._id === eventId);
  if (!ev) return;
  this.setState({
    stepEditorOpen: true,
    stepEditorEventId: eventId,
    // 원본을 직접 건드리지 않도록 복사본을 만들어서 편집한다 (취소하면 그냥 버려짐)
    stepDraft: (ev.steps || []).map(st => ({ title: st.title, done: st.done })),
    stepRemember: true,
  });
};
App.closeStepEditor = function() {
  this.setState({ stepEditorOpen:false, stepEditorEventId:null, stepDraft:[] });
};
App.addStepDraft = function() {
  if (this.state.stepDraft.length >= 8) return;
  this.setState(s => ({ stepDraft: [...s.stepDraft, { title:'', done:false }] }));
};
App.removeStepDraft = function(index) {
  if (this.state.stepDraft.length <= 1) return;
  this.setState(s => ({ stepDraft: s.stepDraft.filter((_, i) => i !== index) }));
};
App.moveStepDraft = function(index, delta) {
  const next = index + delta;
  if (next < 0 || next >= this.state.stepDraft.length) return;
  this.setState(s => {
    const arr = [...s.stepDraft];
    [arr[index], arr[next]] = [arr[next], arr[index]];
    return { stepDraft: arr };
  });
};
App.saveStepDraft = async function() {
  const s = this.state;
  const ev = s.events.find(e => e._id === s.stepEditorEventId);
  if (!ev) return;

  const steps = s.stepDraft
    .map(st => ({ title: String(st.title || '').trim(), done: st.done }))
    .filter(st => st.title);
  if (!steps.length) {
    alert('단계는 최소 1개 이상이어야 해요.');
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/schedule/${ev._id}/steps`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ steps }),
    });
    if (!res.ok) throw new Error((await res.json()).error || '단계 저장 실패');

    // 체크돼 있으면 이 구성을 기억해뒀다가 다음 같은 종류의 일정에 먼저 제안한다
    if (s.stepRemember && ev.stepTemplateKey) {
      this.setStepPref(ev.stepTemplateKey, steps.map(st => st.title));
    }

    await this.reloadAll();
    this.closeStepEditor();
    this.showToast(s.stepRemember && ev.stepTemplateKey
      ? `단계를 바꿨어요. 다음 ${this.STEP_TEMPLATE_LABELS[ev.stepTemplateKey] || ''} 일정에도 적용할게요!`
      : '준비 단계를 바꿨어요!');
  } catch (err) { alert('단계 저장 실패: ' + err.message); }
};
App.forgetStepPref = function(templateKey) {
  this.clearStepPref(templateKey);
  this.render();
  this.showToast('기억해둔 단계 구성을 지웠어요.');
};

// 이미 등록된 일정의 준비기간을 다시 조정 (시작일과 단계 계획일이 서버에서 재계산됨)
App.changeEventLead = async function(eventId, delta) {
  const ev = this.state.events.find(e => e._id === eventId);
  if (!ev) return;
  const next = Math.min(30, Math.max(1, (ev.leadTimeDays || 0) + delta));
  if (next === ev.leadTimeDays) return;
  try {
    const res = await fetch(`${API_BASE}/schedule/${eventId}`, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ leadTimeDays: next, categories: this.categories() }),
    });
    if (!res.ok) throw new Error((await res.json()).error || '준비기간 수정 실패');
    await this.reloadAll();
    this.render();
  } catch (err) { alert('준비기간 수정 실패: ' + err.message); }
};

// 마감 후 회고. 답한 결과를 다음 같은 카테고리 등록의 기본값에도 반영한다.
App.saveRetro = async function(eventId, feeling) {
  const ev = this.state.events.find(e => e._id === eventId);
  try {
    const res = await fetch(`${API_BASE}/schedule/${eventId}/retro`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ feeling }),
    });
    if (!res.ok) throw new Error((await res.json()).error || '회고 저장 실패');

    // "부족했다"고 하면 다음엔 하루 더, "넉넉했다"면 하루 덜 잡도록 개인화 값을 조정
    const delta = feeling === 'tight' ? 1 : (feeling === 'loose' ? -1 : 0);
    if (ev && ev.leadTimeDays && delta !== 0) {
      const category = ev.category || '기타';
      const base = this.getLeadPref(category) || ev.leadTimeDays;
      this.setLeadPref(category, Math.min(30, Math.max(1, base + delta)));
    }

    await this.reloadAll();
    this.render();
    this.showToast(feeling === 'tight' ? '다음엔 하루 더 일찍 시작하도록 기억해둘게요!' : '기록했어요. 고마워요!');
  } catch (err) { alert('회고 저장 실패: ' + err.message); }
};

App.analyze = async function() {
  if (this.state.analyzing) return;
  // 버튼은 항상 눌리게 해뒀으므로 여기서 빈 입력을 막는다.
  // 조용히 무시하면 "눌렀는데 아무 일도 안 난다"고 느끼므로 안내를 띄운다.
  if (!this.state.noticeText.trim() && !this.state.imageFile) {
    this.showToast('공지 내용을 입력하거나 스크린샷을 올려주세요.');
    return;
  }
  this.setState({ analyzing:true, parsedResult:null, analyzeError:null, addedEvent:false, addedTodo:false, leadDraft:null, stepPrefApplied:false });
  try {
    let res;
    if (this.state.imageFile) {
      const formData = new FormData();
      formData.append('image', this.state.imageFile);
      // multipart라 JSON 문자열로 실어 보낸다
      formData.append('categories', JSON.stringify(this.categories()));
      res = await fetch(`${API_BASE}/notices/analyze-image`, { method:'POST', body: formData });
    } else {
      res = await fetch(`${API_BASE}/notices/analyze-text`, { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ text: this.state.noticeText.trim(), categories: this.categories() }) });
    }
    if (!res.ok) throw new Error((await res.json()).error || '분석 실패');
    const data = await res.json();

    // 리드타임 개인화 2단계 (기획서 9.4):
    // 같은 카테고리를 지난번에 등록할 때 사용자가 고른 값이 있으면 그 값을 기본값으로 올린다.
    const r = data.result;
    let leadDraft = null;
    if (r.needsPrep) {
      const pref = this.getLeadPref(r.category);
      leadDraft = pref || r.leadTimeDays;
    }

    // 같은 종류의 일정에서 예전에 단계를 고쳐둔 적이 있으면 그 구성을 먼저 보여준다
    let stepPrefApplied = false;
    if (r.event && r.event.needsPrep) {
      const saved = this.getStepPref(r.event.stepTemplateKey);
      if (saved) {
        r.event.steps = saved.map(title => ({ title, plannedDate:'', done:false, doneAt:null }));
        stepPrefApplied = true;
      }
    }

    this.setState({ analyzing:false, parsedResult:data, leadDraft, stepPrefApplied });
  } catch (err) {
    this.setState({ analyzing:false, analyzeError: err.message });
  }
};

// 확인 화면에서 준비기간을 하루씩 늘리거나 줄임
App.adjustLead = function(delta) {
  const r = this.state.parsedResult && this.state.parsedResult.result;
  if (!r) return;
  const current = this.state.leadDraft !== null ? this.state.leadDraft : (r.leadTimeDays || 0);
  const next = Math.min(30, Math.max(1, current + delta));
  this.setState({ leadDraft: next });
};

App.addParsedEvent = async function() {
  const p = this.state.parsedResult;
  if (!p || !p.result.event || this.state.addedEvent) return;
  const r = p.result;
  const leadDays = r.needsPrep
    ? (this.state.leadDraft !== null ? this.state.leadDraft : r.leadTimeDays)
    : 0;
  try {
    await fetch(`${API_BASE}/notices/confirm`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        sourceType:p.sourceType, rawContent:p.rawContent,
        summary:r.summary, priority:r.priority, category:r.category,
        categories: this.categories(),
        // 날짜 계산은 서버가 다시 하므로 여기서는 조정된 일수와 단계 제목만 넘긴다
        addEvent: {
          ...r.event,
          leadTimeDays: leadDays,
          stepTitles: (r.event.steps || []).map(st => st.title),
        },
      }),
    });
    // 이번에 고른 값을 다음 같은 카테고리 등록의 기본값으로 기억해둔다 (기획서 9.4)
    if (r.needsPrep && leadDays > 0) this.setLeadPref(r.category, leadDays);

    await this.reloadAll();
    this.setState({ addedEvent:true });
    this.showToast(r.needsPrep
      ? `${this.formatDue(this.prepStart(r.event, leadDays))}부터 준비 시작이에요!`
      : `"${r.event.title}" 일정이 등록됐어요!`);
    this.scheduleTestAlarm(r.event);
    this.checkAnalysisComplete();
  } catch (err) { alert('저장 실패: ' + err.message); }
};
App.addParsedTodo = async function() {
  const p = this.state.parsedResult;
  if (!p || !p.result.todo || this.state.addedTodo) return;
  try {
    await fetch(`${API_BASE}/notices/confirm`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ sourceType:p.sourceType, rawContent:p.rawContent, summary:p.result.summary, priority:p.result.priority, category:p.result.category, addTodo:p.result.todo, categories: this.categories() }),
    });
    await this.reloadAll();
    this.setState({ addedTodo:true });
    this.checkAnalysisComplete();
  } catch (err) { alert('저장 실패: ' + err.message); }
};
// 필요한 항목(일정/할일)이 있으면 그게 다 추가됐는지 확인하고, 다 됐으면 분석 카드를 비워서
// 사용자가 바로 다음 공지를 입력할 수 있게 함
App.checkAnalysisComplete = function() {
  const p = this.state.parsedResult;
  if (!p) return;
  const eventDone = !p.result.event || this.state.addedEvent;
  const todoDone = !p.result.todo || this.state.addedTodo;
  if (eventDone && todoDone) {
    setTimeout(() => {
      this.setState({ parsedResult:null, noticeText:'', imageFile:null, imagePreviewUrl:null, addedEvent:false, addedTodo:false, leadDraft:null, stepPrefApplied:false });
    }, 900); // "추가됨" 표시를 잠깐 보여준 뒤 비움
  }
};

      { icon: 'shortcut', text: '단축어 앱 → + → 세부사항에서 "공유 시트에서 보기" 켜기' },
      { icon: 'text', text: '"URL의 콘텐츠 가져오기" 동작 추가, 메소드는 POST' },
      { icon: 'link', text: '본문(JSON)에 키 "text", 값은 공유 시트 입력 변수로 설정' },
    ],
    codeHint: `${window.location.origin}/api/notices/quick-add`,
  },
];

App.renderOnboarding = function(t) {
  const s = this.state;
  const idx = s.onboardingStep;
  const slide = this.ONBOARDING_SLIDES[idx];
  const isLast = idx === this.ONBOARDING_SLIDES.length - 1;

  const iconSvg = (name) => {
    const common = 'width="20" height="20" viewBox="0 0 24 24" fill="none"';
    if (name === 'share') return `<svg ${common}><path d="M12 3v12M8 7l4-4 4 4M5 12v6a2 2 0 002 2h10a2 2 0 002-2v-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    if (name === 'plus') return `<svg ${common}><rect x="3" y="3" width="18" height="18" rx="4" stroke="#fff" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`;
    if (name === 'check') return `<svg ${common}><path d="M4 12l6 6L20 6" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    if (name === 'shortcut') return `<svg ${common}><rect x="3" y="3" width="18" height="18" rx="5" stroke="#fff" stroke-width="2"/><path d="M8 12h8M8 8h5M8 16h5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`;
    if (name === 'text') return `<svg ${common}><path d="M4 6h16M4 12h16M4 18h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`;
    if (name === 'link') return `<svg ${common}><path d="M9 15l6-6M10 6l1-1a4 4 0 015.7 5.7l-1.4 1.4M14 18l-1 1a4 4 0 01-5.7-5.7l1.4-1.4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    return '';
  };

  const stepsHtml = slide.steps.map((st, i) => `
    <div style="${this.styleStr({ display:'flex', alignItems:'flex-start', gap:12, marginBottom:14 })}">
      <div style="${this.styleStr({ width:30, height:30, borderRadius:15, background:'rgba(255,255,255,0.16)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 })}">${iconSvg(st.icon)}</div>
      <div style="${this.styleStr({ fontSize:13.5, lineHeight:1.5, color:'rgba(255,255,255,0.92)', paddingTop:4 })}">${this.esc(st.text)}</div>
    </div>
  `).join('');

  const codeHint = slide.codeHint ? `
    <div style="${this.styleStr({ background:'rgba(255,255,255,0.12)', borderRadius:10, padding:'10px 12px', fontSize:11.5, color:'#fff', wordBreak:'break-all', marginTop:6, marginBottom:4, fontFamily:'monospace' })}">${this.esc(slide.codeHint)}</div>
  ` : '';

  const dots = this.ONBOARDING_SLIDES.map((_, i) => `
    <div style="${this.styleStr({ width: i===idx?18:6, height:6, borderRadius:3, background: i===idx?'#fff':'rgba(255,255,255,0.35)', transition:'width .2s' })}"></div>
  `).join('');

  return `
    <div style="${this.styleStr({ position:'absolute', inset:0, background:'linear-gradient(160deg, #3B4177, #262B54)', zIndex:100, display:'flex', flexDirection:'column', padding:'40px 26px 28px', color:'#fff' })}">
      <div style="${this.styleStr({ textAlign:'right', marginBottom:6 })}">
        <span style="${this.styleStr({ fontSize:12.5, color:'rgba(255,255,255,0.7)', cursor:'pointer' })}" onclick="App.skipOnboarding()">건너뛰기</span>
      </div>
      <div style="${this.styleStr({ flex:1, display:'flex', flexDirection:'column', justifyContent:'center' })}">
        <div style="${this.styleStr({ fontSize:21, fontWeight:800, lineHeight:1.35, whiteSpace:'pre-line', marginBottom:10 })}">${this.esc(slide.title)}</div>
        <div style="${this.styleStr({ fontSize:13, color:'rgba(255,255,255,0.75)', lineHeight:1.5, marginBottom:22 })}">${this.esc(slide.body)}</div>
        ${stepsHtml}
        ${codeHint}
      </div>
      <div style="${this.styleStr({ display:'flex', justifyContent:'center', gap:6, marginBottom:18 })}">${dots}</div>
      <div style="${this.styleStr({ padding:15, borderRadius:14, background:'#fff', color:'#3B4177', fontWeight:800, fontSize:15, textAlign:'center', cursor:'pointer' })}" onclick="App.nextOnboarding()">${isLast ? '시작하기' : '다음'}</div>
    </div>
  `;
};

App.renderToast = function(t) {
  const s = this.state;
  return `
    <div style="${this.styleStr({ position:'absolute', left:16, right:16, bottom:'calc(78px + env(safe-area-inset-bottom))', zIndex:200, display:'flex', justifyContent:'center', pointerEvents:'none' })}">
      <div style="${this.styleStr({ background: s.dark ? '#2C2E3E' : '#1B1D2A', color:'#fff', padding:'12px 18px', borderRadius:14, fontSize:13.5, fontWeight:700, boxShadow:'0 6px 20px rgba(0,0,0,0.3)', maxWidth:'90%', textAlign:'center' })}">${this.esc(s.toastMessage)}</div>
    </div>
  `;
};

// ---------- 알림/알람 (테스트용) ----------
// 실제 서비스면 서버가 예약 발송을 하겠지만, 지금은 데모/테스트 목적이라
// 화면에 떠있는 동안 브라우저에서 직접 타이머로 알려주는 방식으로 구현함
App.requestNotifyPermission = function() {
  if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
    Notification.requestPermission().catch(() => {});
  }
};

// VAPID 공개키(base64url 문자열)를 PushManager가 원하는 Uint8Array 형태로 변환
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

// 진짜 웹 푸시 구독: 서비스워커 등록 → 알림 권한 요청 → 구독 생성 → 서버에 저장
// 버튼 클릭(사용자 제스처) 안에서 호출해야 iOS에서도 확실히 동작함
App.enablePushNotifications = async function() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    this.showToast('이 브라우저는 푸시 알림을 지원하지 않아요.');
    return;
  }
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      this.showToast('알림 권한을 허용해야 푸시를 받을 수 있어요.');
      return;
    }

    const reg = await navigator.serviceWorker.register('/service-worker.js');
    await navigator.serviceWorker.ready;

    const { publicKey } = await fetch(`${API_BASE}/push/vapid-public-key`).then(r => r.json());
    if (!publicKey) {
      this.showToast('서버에 VAPID 키가 설정 안 돼있어요.');
      return;
    }

    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey),
      });
    }

    await fetch(`${API_BASE}/push/subscribe`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(sub.toJSON()),
    });

    this.setState({ pushEnabled: true });
    this.showToast('푸시 알림이 켜졌어요! 🔔');
  } catch (err) {
    console.error(err);
    this.showToast('푸시 설정 실패: ' + err.message);
  }
};

// 앱 시작할 때 이미 구독돼있는지 조용히 확인만 함 (버튼 상태 표시용)
App.checkPushEnabled = async function() {
  try {
    if (!('serviceWorker' in navigator)) return;
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg) return;
    const sub = await reg.pushManager.getSubscription();
    if (sub) this.setState({ pushEnabled: true });
  } catch (e) { /* 조용히 무시 */ }
};

App.showToast = function(message) {
  this.setState({ toastMessage: message });
  // 브라우저 알림 권한이 있으면 실제 알림도 같이 띄움 (앱이 백그라운드여도 보임)
  try {
    if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
      new Notification('신박한 캘린더', { body: message });
    }
  } catch (e) { /* 알림 API 미지원 브라우저는 무시 */ }
  clearTimeout(this._toastTimer);
  this._toastTimer = setTimeout(() => { this.setState({ toastMessage: null }); }, 3000);
};
// 일정 등록 1분 뒤 "테스트용" 알람을 울려줌 (실제 시작 시간이 아니라 등록 시점 기준 1분 후)
App.scheduleTestAlarm = function(event) {
  setTimeout(() => {
    this.showToast(`⏰ [테스트 알람] "${event.title}" 일정 알림이에요!`);
  }, 60 * 1000);
};

App.nextOnboarding = function() {
  if (this.state.onboardingStep < this.ONBOARDING_SLIDES.length - 1) {
    this.setState(s => ({ onboardingStep: s.onboardingStep + 1 }));
  } else {
    this.closeOnboarding();
  }
};
App.skipOnboarding = function() { this.closeOnboarding(); };
App.closeOnboarding = function() {
  localStorage.setItem('sc_onboarding_done', '1');
  this.setState({ showOnboarding: false, onboardingStep: 0 });
};

window.App = App;
App.init();
</script>
