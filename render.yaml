services:
  - type: web
    name: sinbak-calendar
    runtime: node
    plan: free
    rootDir: smart-calendar
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /health
    # 따옴표 필수: YAML 1.1 파서는 따옴표 없는 off를 불리언 false로 읽어버린다.
    # (이 필드는 "off" | "commit" | "checksPass" 문자열만 받는다)
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # 로그인 토큰 서명 키. Render가 한 번 만들어 계속 유지하므로
      # 재배포되어도 심사위원의 로그인이 풀리지 않는다.
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite,gemini-3.1-flash,gemini-2.5-flash
      # 웹 푸시(VAPID). 안 넣으면 서버는 정상 동작하지만 푸시 발송만 조용히 꺼진다.
      # 로컬 .env에 만들어둔 값을 그대로 붙여넣으면 된다
      # (새로 만들려면: npx web-push generate-vapid-keys)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # 푸시 서비스에 연락처로 전달되는 값. 운영하는 주소로 바꿔서 쓰면 된다.
      - key: VAPID_SUBJECT
        sync: false
