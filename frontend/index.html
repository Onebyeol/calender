<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>신박한 캘린더</title>

<!-- iOS: 홈 화면에 추가했을 때 브라우저 주소창 없이 풀스크린 앱처럼 열리게 함 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="신박한 캘린더" />
<meta name="theme-color" content="#3B4177" />
<link rel="apple-touch-icon" href="icon-192.png" />

<!-- Android: 홈 화면에 추가(PWA) 지원 -->
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Jua', -apple-system, sans-serif;
    background: #EDEDF2;
  }
  #page-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  #app-shell {
    width: 100%;
    max-width: 430px;
    height: 100vh;
    height: 100dvh;
    max-height: 926px;
    min-height: 600px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.15);
  }
  input, textarea, select { font-family: 'Jua', sans-serif; outline: none; }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
<div id="page-wrap">
  <div id="app-shell"></div>
</div>

<script>
const API_BASE = '/api';

const PRIORITY_META = {
  high: { label: '높음', color: '#EF6F5B' },
  medium: { label: '보통', color: '#E8A23D' },
  low: { label: '낮음', color: '#6FA287' },
};
const WEEKDAY_NAMES = ['일','월','화','수','목','금','토'];
const SAMPLE_NOTICE = '[학사공지] 2026학년도 2학기 수강신청 정정기간 안내\n\n기간: 2026.07.29.(수) 09:00 ~ 18:00\n대상: 전체 재학생\n방법: 학사정보시스템 로그인 후 신청\n문의: 학사지원팀 (02-123-4567)';

function todayIso() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ============================================================
// App: 상태 저장 + 렌더링을 담당하는 싱글턴 객체
// (React 없이, 상태가 바뀔 때마다 앱 전체를 다시 그리는 단순한 구조)
// ============================================================
const App = {
  state: {
    tab: 'calendar', // 'notify' | 'notice' | 'calendar' | 'todo'
    dark: false,
    viewYear: Number(todayIso().slice(0,4)),
    viewMonth: Number(todayIso().slice(5,7)) - 1,
    selectedDate: todayIso(),
    todoDate: todayIso(),
    events: [],
    todos: [],
    loading: true,

    modalOpen: false,
    modalMode: 'add',
    form: { id: null, title: '', startDate: todayIso(), endDate: todayIso(), start: '09:00', end: '10:00', alarm: true, notify: true, priority: 'medium' },
    detailEventId: null,

    todoModalOpen: false,
    todoDraftTitle: '',

    authScreen: null, // null | 'auth' | 'profile'
    authMode: 'login',
    authName: '', authEmail: '', authPassword: '',
    isLoggedIn: false,

    noticeText: '',
    imageFile: null,
    imagePreviewUrl: null,
    analyzing: false,
    analyzeError: null,
    parsedResult: null, // { sourceType, rawContent, result: {summary,priority,category,event,todo} }
    addedEvent: false,
    addedTodo: false,

    showOnboarding: false,
    onboardingStep: 0,
  },

  setState(patch) {
    this.state = { ...this.state, ...(typeof patch === 'function' ? patch(this.state) : patch) };
    this.render();
  },

  async init() {
    // 아이폰 "단축어"에서 공유 시트로 텍스트를 보내면
    // ?tab=notice&text=... 형태로 열리도록 되어있음 → 공지 탭에 자동으로 채워줌
    const params = new URLSearchParams(location.search);
    const sharedText = params.get('text');
    if (sharedText) {
      this.state.tab = 'notice';
      this.state.noticeText = sharedText;
      history.replaceState(null, '', location.pathname); // 주소창에서 파라미터 지움
    }

    // 최초 1회만 사용 안내 가이드 표시
    if (!localStorage.getItem('sc_onboarding_done')) {
      this.state.showOnboarding = true;
    }

    await this.reloadAll();
    this.state.loading = false;
    this.render();
  },

  async reloadAll() {
    try {
      const [events, todos] = await Promise.all([
        fetch(`${API_BASE}/schedule`).then(r => r.json()),
        fetch(`${API_BASE}/todos`).then(r => r.json()),
      ]);
      this.state.events = events;
      this.state.todos = todos;
    } catch (err) {
      console.error('데이터 로딩 실패', err);
    }
  },
};

// ---------- 유틸 ----------
App.theme = function(dark) {
  return dark ? {
    bg: '#12131C', surface: '#1C1E2B', surfaceAlt: '#232538', text: '#EDEDF3',
    textMuted: '#9A9CB0', textFaint: '#6C6E82', border: '#2C2E3E', primary: '#6B74C9',
  } : {
    bg: '#F7F7FA', surface: '#FFFFFF', surfaceAlt: '#F0F0F6', text: '#1B1D2A',
    textMuted: '#6B6E85', textFaint: '#9C9EB2', border: '#E7E7EE', primary: '#3B4177',
  };
};
App.addDays = function(iso, n) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
App.formatTime = function(hhmm) {
  if (!hhmm) return '';
  const [h, m] = hhmm.split(':').map(Number);
  const period = h < 12 ? '오전' : '오후';
  let hh = h % 12; if (hh === 0) hh = 12;
  return `${period} ${hh}:${String(m).padStart(2,'0')}`;
};
App.formatDue = function(iso) {
  const d = new Date(iso + 'T00:00:00');
  return `${d.getMonth()+1}/${d.getDate()} (${WEEKDAY_NAMES[d.getDay()]})`;
};
App.formatDayHeader = function(iso) {
  const d = new Date(iso + 'T00:00:00');
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${WEEKDAY_NAMES[d.getDay()]})`;
};
App.esc = function(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
};
App.styleStr = function(obj) {
  // 'flex', 'zIndex' 처럼 단위가 없어야 하는 속성 목록 (이것 말고는 숫자면 전부 px를 붙여야 함)
  const UNITLESS = new Set(['flex', 'flexGrow', 'flexShrink', 'zIndex', 'opacity', 'fontWeight', 'order', 'lineHeight']);
  return Object.entries(obj).map(([k, v]) => {
    const kebab = k.replace(/[A-Z]/g, (m) => '-' + m.toLowerCase());
    const val = (typeof v === 'number' && !UNITLESS.has(k)) ? `${v}px` : v;
    return `${kebab}:${val}`;
  }).join(';');
};

// ---------- 캘린더 월 그리드 (겹치는 멀티데이 일정을 레인에 배치) ----------
App.buildGrid = function(dark) {
  const { viewYear, viewMonth, selectedDate, events } = this.state;
  const first = new Date(viewYear, viewMonth, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
  const tIso = todayIso();
  const flatDays = [];
  for (let i = 0; i < totalCells; i++) {
    const dayNum = i - startWeekday + 1;
    let cellDate;
    if (dayNum < 1) cellDate = new Date(viewYear, viewMonth - 1, new Date(viewYear, viewMonth, 0).getDate() + dayNum);
    else if (dayNum > daysInMonth) cellDate = new Date(viewYear, viewMonth + 1, dayNum - daysInMonth);
    else cellDate = new Date(viewYear, viewMonth, dayNum);
    const inMonth = dayNum >= 1 && dayNum <= daysInMonth;
    const iso = `${cellDate.getFullYear()}-${String(cellDate.getMonth()+1).padStart(2,'0')}-${String(cellDate.getDate()).padStart(2,'0')}`;
    flatDays.push({ iso, day: cellDate.getDate(), inMonth, isToday: iso === tIso, isSelected: iso === selectedDate });
  }
  const weeks = [];
  for (let i = 0; i < flatDays.length; i += 7) weeks.push(flatDays.slice(i, i + 7));

  const maxLanes = 3;
  return weeks.map((week) => {
    const weekStart = week[0].iso, weekEnd = week[6].iso;
    const overlapping = events.filter(ev => ev.startDate <= weekEnd && ev.endDate >= weekStart)
      .slice().sort((a, b) => a.startDate === b.startDate ? b.endDate.localeCompare(a.endDate) : a.startDate.localeCompare(b.startDate));
    const laneEnds = [];
    const bars = [];
    let hiddenCount = 0;
    overlapping.forEach(ev => {
      const segStart = ev.startDate > weekStart ? ev.startDate : weekStart;
      const segEnd = ev.endDate < weekEnd ? ev.endDate : weekEnd;
      const colStart = week.findIndex(d => d.iso === segStart);
      const colEndIdx = week.findIndex(d => d.iso === segEnd);
      const colSpan = colEndIdx - colStart + 1;
      let lane = laneEnds.findIndex(end => end < colStart);
      if (lane === -1) lane = laneEnds.length;
      if (lane >= maxLanes) { hiddenCount++; return; }
      laneEnds[lane] = colStart + colSpan - 1;
      const isCapLeft = segStart === ev.startDate, isCapRight = segEnd === ev.endDate;
      bars.push({
        id: ev._id, title: ev.title, lane,
        left: (colStart / 7) * 100, width: (colSpan / 7) * 100,
        color: (PRIORITY_META[ev.priority] || PRIORITY_META.medium).color,
        isCapLeft, isCapRight,
      });
    });
    const laneCount = Math.min(maxLanes, laneEnds.length);
    return { days: week, bars, laneCount, hiddenCount };
  });
};

// ---------- 렌더 ----------
App.render = function() {
  const s = this.state;
  const t = this.theme(s.dark);
  document.getElementById('page-wrap').style.background = s.dark ? '#0a0a10' : '#EDEDF2';
  const html = `
    <div style="${this.styleStr({ height:'100%', display:'flex', flexDirection:'column', position:'relative', background:t.bg, color:t.text, fontFamily:"'Jua',sans-serif" })}">
      ${this.renderTopBar(t)}
      ${s.tab === 'calendar' ? this.renderCalendar(t) : ''}
      ${s.tab === 'notify' ? this.renderNotify(t) : ''}
      ${s.tab === 'notice' ? this.renderNotice(t) : ''}
      ${s.tab === 'todo' ? this.renderTodo(t) : ''}
      ${s.tab === 'help' ? this.renderHelp(t) : ''}
      ${s.tab === 'calendar' ? this.renderFab(t) : ''}
      ${this.renderTabBar(t)}
      ${s.modalOpen ? this.renderEventModal(t) : ''}
      ${s.todoModalOpen ? this.renderTodoModal(t) : ''}
      ${s.detailEventId != null ? this.renderDetailModal(t) : ''}
      ${s.authScreen === 'auth' ? this.renderAuth(t) : ''}
      ${s.authScreen === 'profile' ? this.renderProfile(t) : ''}
      ${s.showOnboarding ? this.renderOnboarding(t) : ''}
    </div>
  `;
  document.getElementById('app-shell').innerHTML = html;
};

App.renderTopBar = function(t) {
  const s = this.state;
  const title = { notify: '알림', notice: '공지', calendar: '', todo: 'To do list', help: '사용 설정' }[s.tab];
  return `
    <div style="${this.styleStr({ display:'flex', alignItems:'center', justifyContent:'space-between', paddingTop:'calc(10px + env(safe-area-inset-top))', paddingLeft:16, paddingRight:16, paddingBottom:6, flexShrink:0 })}">
      <div style="${this.styleStr({ width:34, height:34, borderRadius:17, display:'flex', alignItems:'center', justifyContent:'center', background:t.surfaceAlt, border:`1px solid ${t.border}`, cursor:'pointer', flexShrink:0 })}" onclick="App.toggleDark()">
        ${s.dark
          ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="${t.text}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`
          : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="${t.text}" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="${t.text}" stroke-width="2" stroke-linecap="round"/></svg>`}
      </div>
      ${s.tab === 'calendar' ? `
        <div style="${this.styleStr({ display:'flex', alignItems:'center', gap:7 })}">
          <img src="logo-mark.png" alt="신박한 캘린더 로고" style="${this.styleStr({ width:24, height:24, objectFit:'contain', flexShrink:0 })}" />
          <div style="${this.styleStr({ fontSize:16.5, fontWeight:800, color:t.text, letterSpacing:'-0.3px', fontFamily:"'Jua',sans-serif" })}">신박한 캘린더</div>
        </div>` : `<div style="${this.styleStr({ fontSize:17, fontWeight:800, color:t.text })}">${title}</div>`}
      ${s.tab === 'calendar'
        ? (s.isLoggedIn
            ? `<div style="${this.styleStr({ width:34, height:34, borderRadius:17, background:t.primary, color:'#fff', fontSize:13, fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0 })}" onclick="App.setState({authScreen:'profile'})">${this.esc((s.authName.trim()[0]) || 'U')}</div>`
            : `<div style="${this.styleStr({ padding:'7px 12px', borderRadius:20, background:t.primary, color:'#fff', fontSize:12.5, fontWeight:700, cursor:'pointer', whiteSpace:'nowrap' })}" onclick="App.setState({authScreen:'auth', authMode:'login'})">로그인</div>`)
        : `<div style="width:34px"></div>`}
    </div>
  `;
};

App.renderCalendar = function(t) {
  const s = this.state;
  const weeks = this.buildGrid(s.dark);
  const monthLabel = `${s.viewYear}년 ${s.viewMonth + 1}월`;
  const gridLineColor = s.dark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.045)';

  // ==================== 캘린더 칸 크기 - 여기 숫자만 바꾸면 됨 (다 따로따로 조절 가능) ====================
  const CELL_W = 55.5;          // 날짜 칸 너비
  const CELL_H = 22;            // 날짜 칸(숫자 줄) 높이
  const ROW_GAP = 80;           // 주(week) 한 줄과 다음 줄 사이 간격
  const DAY_CIRCLE_SIZE = 20;   // 날짜 숫자 원 크기 (지름)
  const DAY_FONT_SIZE = 13;     // 날짜 숫자 폰트 크기
  const BAR_H = 19;             // 일정 바 하나의 높이
  const BAR_GAP = 22;           // 일정 바가 여러 개 겹칠 때, 바와 바 사이 세로 간격
  const BAR_FONT_SIZE = 11;     // 일정 바 안의 글씨 크기
  const WEEKDAY_FONT_SIZE = 13; // 요일(일/월/화...) 글씨 크기
  const WEEKDAY_ROW_PADDING = '3px 0'; // 요일 줄 위아래 여백
  // ============================================================================================


  const GRID_W = CELL_W * 7;

  const weeksHtml = weeks.map((week, wi) => {
    const daysHtml = week.days.map(day => `
      <div style="${this.styleStr({ display:'flex', alignItems:'center', justifyContent:'center', width:CELL_W, height:CELL_H, cursor:'pointer' })}" onclick="App.setState({selectedDate:'${day.iso}'})">
        <div style="${this.styleStr({
          width:DAY_CIRCLE_SIZE, height:DAY_CIRCLE_SIZE, borderRadius:DAY_CIRCLE_SIZE/2, display:'flex', alignItems:'center', justifyContent:'center',
          fontSize:DAY_FONT_SIZE, fontWeight: day.isToday ? 800 : 600,
          color: day.isSelected ? '#fff' : (day.inMonth ? t.text : t.textFaint),
          background: day.isSelected ? t.primary : 'transparent',
          border: (day.isToday && !day.isSelected) ? `1.5px solid ${t.primary}` : '1.5px solid transparent',
        })}">${day.day}</div>
      </div>
    `).join('');

    const barsHtml = week.bars.map(bar => `
      <div style="${this.styleStr({
        position:'absolute', top: bar.lane * BAR_GAP, left: `calc(${bar.left}%)`, width: `calc(${bar.width}% - 3px)`, height:BAR_H,
        background: bar.color, color:'#fff', fontSize:BAR_FONT_SIZE, fontWeight:800, display:'flex', alignItems:'center',
        paddingLeft:7, overflow:'hidden', whiteSpace:'nowrap', textOverflow:'ellipsis', cursor:'pointer',
        marginLeft: bar.isCapLeft ? '1.5px' : '0',
        boxShadow: '0 1px 2px rgba(0,0,0,0.15)',
        borderRadius: `${bar.isCapLeft?8:3}px ${bar.isCapRight?8:3}px ${bar.isCapRight?8:3}px ${bar.isCapLeft?8:3}px`,
      })}" onclick="event.stopPropagation(); App.openDetail('${bar.id}')">${this.esc(bar.title)}</div>
    `).join('');

    const hiddenHtml = week.hiddenCount > 0
      ? `<div style="${this.styleStr({ position:'absolute', top: week.laneCount*BAR_GAP, left:4, fontSize:10, fontWeight:700, color:t.textFaint })}">+${week.hiddenCount}건 더보기</div>`
      : '';

    return `
      <div style="${this.styleStr({ flexShrink:0, display:'flex', flexDirection:'column' })}">
        <div style="${this.styleStr({ height:1, flexShrink:0, marginBottom:3, background: wi>0 ? gridLineColor : 'transparent' })}"></div>
        <div style="${this.styleStr({ display:'flex' })}">${daysHtml}</div>
        <div style="${this.styleStr({ position:'relative', height: week.laneCount*BAR_GAP + (week.hiddenCount>0?14:0), flexShrink:0 })}">${barsHtml}${hiddenHtml}</div>
      </div>
    `;
  }).join('');

  const weekdayHtml = WEEKDAY_NAMES.map((n, i) => `
    <div style="${this.styleStr({ width:CELL_W, textAlign:'center', fontSize:WEEKDAY_FONT_SIZE, fontWeight:700, padding:WEEKDAY_ROW_PADDING, color: i===0?'#EF6F5B':(i===6?'#4F7FE0':t.textFaint) })}">${n}</div>
  `).join('');

  // 세로 구분선 - CELL_W 값에 정확히 맞춰서 그림 (CELL_W를 바꾸면 이것도 자동으로 맞춰짐)
  const verticalLines = `repeating-linear-gradient(to right, transparent, transparent ${CELL_W - 1}px, ${gridLineColor} ${CELL_W - 1}px, ${gridLineColor} ${CELL_W}px)`;

  return `
    <div style="${this.styleStr({ display:'flex', alignItems:'center', justifyContent:'center', gap:20, padding:'2px 16px 4px', flexShrink:0 })}">
      <div style="${this.styleStr({ width:26, height:26, borderRadius:13, display:'flex', alignItems:'center', justifyContent:'center', background:t.surfaceAlt, cursor:'pointer' })}" onclick="App.prevMonth()">
        <svg width="9" height="15" viewBox="0 0 9 15"><path d="M8 1L1 7.5 8 14" stroke="${t.textMuted}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="${this.styleStr({ fontSize:16, fontWeight:700, color:t.text, minWidth:100, textAlign:'center', fontFamily:"'Jua',sans-serif" })}">${monthLabel}</div>
      <div style="${this.styleStr({ width:26, height:26, borderRadius:13, display:'flex', alignItems:'center', justifyContent:'center', background:t.surfaceAlt, cursor:'pointer' })}" onclick="App.nextMonth()">
        <svg width="9" height="15" viewBox="0 0 9 15"><path d="M1 1l7 6.5-7 6.5" stroke="${t.textMuted}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div style="${this.styleStr({ display:'flex', justifyContent:'center', flexShrink:0, borderBottom:`1px solid ${t.border}`, padding:'0 0 4px' })}">${weekdayHtml}</div>
    <div style="${this.styleStr({ flex:1, display:'flex', justifyContent:'center', minHeight:0, overflow:'hidden' })}">
      <div style="${this.styleStr({ width:GRID_W, height:'100%', display:'flex', flexDirection:'column', justifyContent:'flex-start', gap:ROW_GAP, padding:'6px 0 2px', overflow:'auto', position:'relative', backgroundImage:verticalLines })}">${weeksHtml}</div>
    </div>
  `;
};

App.renderNotify = function(t) {
  const s = this.state;
  const groupsMap = {};
  s.events.forEach(ev => { (groupsMap[ev.startDate] = groupsMap[ev.startDate] || []).push(ev); });
  const dates = Object.keys(groupsMap).sort();

  const legend = ['high','medium','low'].map(k => `
    <div style="${this.styleStr({ display:'flex', alignItems:'center', gap:6, fontSize:12, fontWeight:700, color:t.textMuted })}">
      <div style="${this.styleStr({ width:9, height:9, borderRadius:5, background: PRIORITY_META[k].color })}"></div>
      <div>${PRIORITY_META[k].label}</div>
    </div>
  `).join('');

  const groupsHtml = dates.length === 0
    ? `<div style="${this.styleStr({ textAlign:'center', color:t.textFaint, fontSize:13, padding:'60px 20px' })}">아직 등록된 일정이 없어요</div>`
    : dates.map(dateIso => {
      const items = groupsMap[dateIso].slice().sort((a,b) => a.start.localeCompare(b.start));
      const itemsHtml = items.map(ev => `
        <div style="${this.styleStr({ display:'flex', alignItems:'center', gap:10, padding:'11px 4px', borderBottom:`1px solid ${t.border}`, cursor:'pointer' })}" onclick="App.openDetail('${ev._id}')">

      <div style="${this.styleStr({ fontSize:12.5, color:t.textMuted, marginBottom:20 })}">앱을 더 편하게 쓰는 방법을 정리했어요. 처음 접속했을 때 봤던 안내와 같은 내용이에요.</div>

      ${section('① 홈 화면에 추가하기', `
        <p style="margin:0 0 10px">브라우저 주소창 없이, 진짜 앱처럼 아이콘을 눌러서 바로 열 수 있어요.</p>
        ${step(1, 'Safari 하단(또는 상단)의 공유 버튼을 탭하세요.')}
        ${step(2, '메뉴에서 "홈 화면에 추가"를 선택하세요.')}
        ${step(3, '오른쪽 위 "추가"를 누르면 완료! 이제 홈 화면에 신박한 캘린더 아이콘이 생겨요.')}
      `)}

      ${section('② 카톡 공지, 단축어로 한 번에 처리하기', `
        <p style="margin:0 0 10px">카카오톡에서 공지를 공유할 때, 앱을 열지 않고도 AI가 알아서 일정/할일까지 저장해주는 자동화예요. 아이폰 "단축어" 앱에서 한 번만 설정해두면 돼요.</p>
        ${step(1, '단축어 앱 → 오른쪽 위 + 버튼으로 새 단축어 만들기')}
        ${step(2, '동작 검색에서 "공유 시트에서 앱 및 콘텐츠 받기"가 맨 위에 자동으로 들어가 있는지 확인')}
        ${step(3, '동작 검색에서 "URL의 콘텐츠 가져오기"를 추가')}
        ${step(4, 'URL 칸에 서버 주소 + <b>/api/notices/quick-add</b> 를 입력')}
        ${codeBox('예: http://192.168.0.7:4000/api/notices/quick-add')}
        ${step(5, '세부사항 펼치기 → 메소드를 POST로 변경')}
        ${step(6, '본문 요청을 JSON으로 선택하고, 키에 정확히 소문자로 "text"를 입력, 값에는 파란색 "공유 시트 입력" 변수 칩을 넣기')}
        ${step(7, '(선택) "사전 값 가져오기" 동작을 추가해서 방금 결과의 "message" 값을 가져오고, "알림 표시" 동작으로 연결하면 저장 완료 알림까지 뜸')}
        ${step(8, '단축어 이름 지정 후 완료. 이제 단축어 세부사항에서 "공유 시트에서 보기"가 켜져있는지 꼭 확인')}
        <p style="margin:10px 0 0; color:${t.textMuted}; font-size:12px">※ 서버 주소는 컴퓨터 로컬 IP라서 폰이 같은 와이파이에 연결돼 있어야 작동해요. 나중에 실제 배포하면 그 주소로 바꿔야 어디서든 작동해요.</p>
      `)}

      ${section('③ 자주 묻는 것', `
        <p style="margin:0 0 8px"><b>일정에 종료일이 왜 시작일이랑 같이 바뀌나요?</b><br/>하루짜리 일정이 대부분이라, 시작 날짜를 바꾸면 종료 날짜도 자동으로 따라가요. 여러 날짜에 걸친 일정을 만들고 싶으면 종료 날짜만 따로 늘려주면 돼요.</p>
        <p style="margin:0"><b>다크모드는 어디서 켜나요?</b><br/>캘린더 화면 왼쪽 위 해/달 아이콘을 탭하면 바로 전환돼요.</p>
      `)}
    </div>
  `;
};

App.onStartDateChange = function(value) {
  const f = this.state.form;
  const oldStart = f.startDate;
  f.startDate = value;
  // 종료 날짜를 아직 따로 늘려두지 않았거나(=시작일과 같았거나), 시작일이 종료일보다 뒤로 가버린 경우
  // 자동으로 종료 날짜도 같이 맞춰줌 (하루짜리 일정이 대부분이라 이게 훨씬 편함)
  if (f.endDate === oldStart || f.endDate < value) {
    f.endDate = value;
  }
  this.render();
};

App.prevMonth = function() { this.setState(s => { let m=s.viewMonth-1,y=s.viewYear; if(m<0){m=11;y--;} return {viewMonth:m, viewYear:y}; }); };

  this.setState({ modalOpen:true, modalMode:'edit', form:{ id: ev._id, title: ev.title, startDate: ev.startDate, endDate: ev.endDate, start: ev.start, end: ev.end, alarm: ev.alarm, notify: ev.notify, priority: ev.priority } });

App.saveManualTodo = async function() {
  const title = this.state.todoDraftTitle.trim();
  if (!title) return;
  try {
    await fetch(`${API_BASE}/todos`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ title, due: this.state.todoDate }) });
    await this.reloadAll();
    this.setState({ todoModalOpen:false, todoDraftTitle:'' });
  } catch (err) {
    alert('할일 저장 실패: ' + err.message);
  }
};

App.saveEvent = async function() {
  const f = this.state.form;
  if (!f.title.trim()) return;
  const endDate = f.endDate < f.startDate ? f.startDate : f.endDate;
  const payload = { title:f.title, startDate:f.startDate, endDate, start:f.start, end:f.end, alarm:f.alarm, notify:f.notify, priority:f.priority };
  try {
    if (this.state.modalMode === 'edit') {
      await fetch(`${API_BASE}/schedule/${f.id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    } else {
      await fetch(`${API_BASE}/schedule`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    }
    await this.reloadAll();
    this.setState({ modalOpen:false, selectedDate: f.startDate });
  } catch (err) {
    alert('일정 저장 실패: ' + err.message);
  }
};
App.deleteEvent = async function() {
  const f = this.state.form;
  try {
    await fetch(`${API_BASE}/schedule/${f.id}`, { method:'DELETE' });
    await this.reloadAll();
    this.setState({ modalOpen:false });
  } catch (err) {
    alert('일정 삭제 실패: ' + err.message);
  }
};

App.toggleTodo = async function(id) {
  await fetch(`${API_BASE}/todos/${id}`, { method:'PATCH' });

};

App.onImageSelected = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    this.setState({ imageFile:file, imagePreviewUrl: ev.target.result, noticeText:'', parsedResult:null, addedEvent:false, addedTodo:false, analyzeError:null });
  };
  reader.readAsDataURL(file);
};

App.analyze = async function() {
  if (this.state.analyzing) return;
  if (!this.state.noticeText.trim() && !this.state.imageFile) return;
  this.setState({ analyzing:true, parsedResult:null, analyzeError:null, addedEvent:false, addedTodo:false });
  try {
    let res;
    if (this.state.imageFile) {
      const formData = new FormData();
      formData.append('image', this.state.imageFile);
      res = await fetch(`${API_BASE}/notices/analyze-image`, { method:'POST', body: formData });
    } else {
      res = await fetch(`${API_BASE}/notices/analyze-text`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text: this.state.noticeText.trim() }) });
    }
    if (!res.ok) throw new Error((await res.json()).error || '분석 실패');
    const data = await res.json();
    this.setState({ analyzing:false, parsedResult:data });
  } catch (err) {
    this.setState({ analyzing:false, analyzeError: err.message });
  }
};

App.addParsedEvent = async function() {
  const p = this.state.parsedResult;
  if (!p || !p.result.event || this.state.addedEvent) return;
  try {
    await fetch(`${API_BASE}/notices/confirm`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ sourceType:p.sourceType, rawContent:p.rawContent, summary:p.result.summary, priority:p.result.priority, category:p.result.category, addEvent:p.result.event }),
    });
    await this.reloadAll();
    this.setState({ addedEvent:true });
  } catch (err) { alert('저장 실패: ' + err.message); }
};
App.addParsedTodo = async function() {
  const p = this.state.parsedResult;
  if (!p || !p.result.todo || this.state.addedTodo) return;
  try {
    await fetch(`${API_BASE}/notices/confirm`, {

    });
    await this.reloadAll();
    this.setState({ addedTodo:true });
  } catch (err) { alert('저장 실패: ' + err.message); }
};

      { icon: 'shortcut', text: '단축어 앱 → + → 세부사항에서 "공유 시트에서 보기" 켜기' },
      { icon: 'text', text: '"URL의 콘텐츠 가져오기" 동작 추가, 메소드는 POST' },
      { icon: 'link', text: '본문(JSON)에 키 "text", 값은 공유 시트 입력 변수로 설정' },
    ],
    codeHint: `${window.location.origin}/api/notices/quick-add`,
  },
];

App.renderOnboarding = function(t) {
  const s = this.state;
  const idx = s.onboardingStep;
  const slide = this.ONBOARDING_SLIDES[idx];
  const isLast = idx === this.ONBOARDING_SLIDES.length - 1;

  const iconSvg = (name) => {
    const common = 'width="20" height="20" viewBox="0 0 24 24" fill="none"';
    if (name === 'share') return `<svg ${common}><path d="M12 3v12M8 7l4-4 4 4M5 12v6a2 2 0 002 2h10a2 2 0 002-2v-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    if (name === 'plus') return `<svg ${common}><rect x="3" y="3" width="18" height="18" rx="4" stroke="#fff" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`;
    if (name === 'check') return `<svg ${common}><path d="M4 12l6 6L20 6" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    if (name === 'shortcut') return `<svg ${common}><rect x="3" y="3" width="18" height="18" rx="5" stroke="#fff" stroke-width="2"/><path d="M8 12h8M8 8h5M8 16h5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`;
    if (name === 'text') return `<svg ${common}><path d="M4 6h16M4 12h16M4 18h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`;
    if (name === 'link') return `<svg ${common}><path d="M9 15l6-6M10 6l1-1a4 4 0 015.7 5.7l-1.4 1.4M14 18l-1 1a4 4 0 01-5.7-5.7l1.4-1.4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    return '';
  };

  const stepsHtml = slide.steps.map((st, i) => `
    <div style="${this.styleStr({ display:'flex', alignItems:'flex-start', gap:12, marginBottom:14 })}">
      <div style="${this.styleStr({ width:30, height:30, borderRadius:15, background:'rgba(255,255,255,0.16)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 })}">${iconSvg(st.icon)}</div>
      <div style="${this.styleStr({ fontSize:13.5, lineHeight:1.5, color:'rgba(255,255,255,0.92)', paddingTop:4 })}">${this.esc(st.text)}</div>
    </div>
  `).join('');

  const codeHint = slide.codeHint ? `
    <div style="${this.styleStr({ background:'rgba(255,255,255,0.12)', borderRadius:10, padding:'10px 12px', fontSize:11.5, color:'#fff', wordBreak:'break-all', marginTop:6, marginBottom:4, fontFamily:'monospace' })}">${this.esc(slide.codeHint)}</div>
  ` : '';

  const dots = this.ONBOARDING_SLIDES.map((_, i) => `
    <div style="${this.styleStr({ width: i===idx?18:6, height:6, borderRadius:3, background: i===idx?'#fff':'rgba(255,255,255,0.35)', transition:'width .2s' })}"></div>
  `).join('');

  return `
    <div style="${this.styleStr({ position:'absolute', inset:0, background:'linear-gradient(160deg, #3B4177, #262B54)', zIndex:100, display:'flex', flexDirection:'column', padding:'40px 26px 28px', color:'#fff' })}">
      <div style="${this.styleStr({ textAlign:'right', marginBottom:6 })}">
        <span style="${this.styleStr({ fontSize:12.5, color:'rgba(255,255,255,0.7)', cursor:'pointer' })}" onclick="App.skipOnboarding()">건너뛰기</span>
      </div>
      <div style="${this.styleStr({ flex:1, display:'flex', flexDirection:'column', justifyContent:'center' })}">
        <div style="${this.styleStr({ fontSize:21, fontWeight:800, lineHeight:1.35, whiteSpace:'pre-line', marginBottom:10 })}">${this.esc(slide.title)}</div>
        <div style="${this.styleStr({ fontSize:13, color:'rgba(255,255,255,0.75)', lineHeight:1.5, marginBottom:22 })}">${this.esc(slide.body)}</div>
        ${stepsHtml}
        ${codeHint}
      </div>
      <div style="${this.styleStr({ display:'flex', justifyContent:'center', gap:6, marginBottom:18 })}">${dots}</div>
      <div style="${this.styleStr({ padding:15, borderRadius:14, background:'#fff', color:'#3B4177', fontWeight:800, fontSize:15, textAlign:'center', cursor:'pointer' })}" onclick="App.nextOnboarding()">${isLast ? '시작하기' : '다음'}</div>
    </div>
  `;
};

App.nextOnboarding = function() {
  if (this.state.onboardingStep < this.ONBOARDING_SLIDES.length - 1) {
    this.setState(s => ({ onboardingStep: s.onboardingStep + 1 }));
  } else {
    this.closeOnboarding();
  }
};
App.skipOnboarding = function() { this.closeOnboarding(); };
App.closeOnboarding = function() {
  localStorage.setItem('sc_onboarding_done', '1');
  this.setState({ showOnboarding: false, onboardingStep: 0 });
};

window.App = App;
App.init();
</script>
</body>
</html>
